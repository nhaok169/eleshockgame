<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作息博弈 · 大厅</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <div class="hud">
    <div class="brand">
      <div class="t1">局域网双人房</div>
      <div class="t2">同一 Wi‑Fi · 手机浏览器打开 · 不用装 App</div>
    </div>
  </div>
  <p class="hint" style="margin-bottom:14px">两部手机分别进 A、B。电脑打开裁判席看上帝视角。座位页看不到对方未揭示的动作。</p>
  <div class="lobby">
    <div class="lobby-card a">
      <a href="/play.html?seat=A">
        <h2>加入智能体 A</h2>
        <p class="hint">紫色座位 · 只看自己的日志与系统判决</p>
      </a>
    </div>
    <div class="lobby-card b">
      <a href="/play.html?seat=B">
        <h2>加入智能体 B</h2>
        <p class="hint">青色座位 · 只看自己的日志与系统判决</p>
      </a>
    </div>
    <div class="lobby-card host">
      <a href="/host.html">
        <h2>裁判席 / 上帝视角</h2>
        <p class="hint">建议只在电脑打开。能看见双方真实动作，玩家不要看这块。</p>
      </a>
    </div>
  </div>
</div>
</body>
</html>
